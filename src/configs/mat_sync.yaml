name: mat_sync_baseline
description: "Multi-Agent Transformer with synchronous action selection, no communication"

environment:
  n_agents: 5
  arena_size: 25.0
  max_steps: 2000
  event_driven: false
  cooldown_time: 3
  contact_radius: 3.0
  comm_dropout_prob: 0.0
  comm_delay_steps: 0
  sensor_dropout_prob: 0.0

agent:
  agent_type: mat
  use_atoc: false
  hidden_dim: 128
  thought_dim: 64
  n_heads: 4
  n_layers: 2

training:
  num_workers: 4
  num_envs_per_worker: 4
  batch_size: 512
  learning_rate: 3e-4
  gamma: 0.99
  lambda: 0.95
  entropy_coeff: 0.01
  num_epochs: 20
  total_steps: 1_000_000
  checkpoint_freq: 10000

checkpoint:
  save_dir: results/checkpoints
  keep_last_n: 3
  save_frequency: 10000

evaluation:
  eval_episodes: 10
  eval_frequency: 50000

output_dir: results
seed: 42
verbose: true
